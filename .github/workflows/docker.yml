name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: devops-flask-postgres
  IMAGE_TAG: 2.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      # 🛠️ Creamos la variable REPO_LOWERCASE en MAYÚSCULAS para que no falle el entorno
      - name: Formatear repositorio a minusculas
        run: |
          echo "REPO_LOWERCASE=$(echo "${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir Imagen
        run: |
          docker build \
          -t ghcr.io/${{ env.REPO_LOWERCASE }}:${{ env.IMAGE_TAG }} \
          -t ghcr.io/${{ env.REPO_LOWERCASE }}:latest \
          .

      - name: Publicar Imagen
        run: |
          docker push ghcr.io/${{ env.REPO_LOWERCASE }}:${{ env.IMAGE_TAG }}
          docker push ghcr.io/${{ env.REPO_LOWERCASE }}:latest